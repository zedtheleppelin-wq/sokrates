<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOKRATES</title>
<style>
:root{
  --ink:#1d2433;--muted:#7b8394;--line:#e9ebf0;--soft:#f6f7f9;--soft2:#fafbfc;
  --acc:#b4532a;--acc2:#fbefe8;--acc3:#f3d9cb;
  --ok:#2f9e6e;--ok2:#e5f5ee;--warn:#d98a1c;--warn2:#fdf3e2;--bad:#c9442a;--bad2:#fbe9e5;
  --r:16px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);
  font-family:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
#app{min-height:100%}
h1,h2,h3{font-weight:600;margin:0}
.fade{animation:fade .55s var(--ease) both}
.fade2{animation:fade .55s var(--ease) .12s both}
.fade3{animation:fade .55s var(--ease) .24s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.5em 1.05em;transition:all .2s var(--ease);white-space:nowrap}
button:hover{border-color:#cdd2db;background:var(--soft2)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bp{background:var(--ink);color:#fff;border-color:var(--ink)}
.bp:hover{background:#2c3549;border-color:#2c3549}
.ba{background:var(--acc);color:#fff;border-color:var(--acc)}
.ba:hover{background:#9d4521;border-color:#9d4521}
.bg{border-color:transparent;background:transparent}
.bg:hover{background:var(--soft);border-color:transparent}
.bs{padding:.3em .8em;font-size:.88em}
input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:.6em .8em;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
textarea{resize:vertical}
label{display:block;font-size:.86em;color:var(--muted);margin:.9em 0 .3em}
.muted{color:var(--muted)}
.small{font-size:.86em}
.row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:.35em;border-radius:999px;padding:.15em .7em;font-size:.82em;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--acc2);color:var(--acc)}
.chip.ok{background:var(--ok2);color:var(--ok)}
.chip.warn{background:var(--warn2);color:var(--warn)}
.chip.bad{background:var(--bad2);color:var(--bad)}
.card{border:1px solid var(--line);border-radius:var(--r);padding:1.2em 1.3em;background:#fff;transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.card.click{cursor:pointer}
.card.click:hover{box-shadow:0 8px 30px rgba(29,36,51,.07);transform:translateY(-2px)}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .6s var(--ease)}
.brand{letter-spacing:.32em;font-weight:600;font-size:.95em}

/* Start */
.start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;text-align:center;padding:2em}
.start .logo{font-size:clamp(2.6rem,8vw,4.6rem);letter-spacing:.38em;font-weight:300;margin-right:-.38em;animation:fadeOnly 1.6s var(--ease) both}
.start .claim{color:var(--muted);font-size:1.15em;animation:fade 1s var(--ease) .7s both}
.start .btns{display:flex;gap:1em;margin-top:1.4em;animation:fade 1s var(--ease) 1.2s both}
.start .btns button{padding:.9em 2.2em;font-size:1.05em}
.start .foot{position:fixed;bottom:1.2em;animation:fadeOnly 1s 1.6s both}
.column{width:1px;height:46px;background:linear-gradient(var(--acc),transparent);animation:fadeOnly 1.4s .3s both}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8em;padding:.6em 1.2em;min-height:56px}
.top .ctx{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:1.6em 1.4em 4em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.1em}
.tabs{display:flex;gap:.3em;background:var(--soft);padding:.25em;border-radius:999px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:none;background:transparent;padding:.4em 1em}
.tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sec{margin-top:2em}
.sec>h3{margin-bottom:.7em}
.ms{border:1px solid var(--line);border-radius:var(--r);padding:1em 1.1em;margin-bottom:.8em;background:#fff}
.ms .num{width:28px;height:28px;border-radius:50%;background:var(--acc2);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:.9em;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1em}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.canon-item{display:flex;gap:.8em;align-items:center;padding:.7em .9em;border:1px solid var(--line);border-radius:12px;margin-bottom:.5em}
.drop{border:1.5px dashed #d6dae2;border-radius:var(--r);padding:1.1em;text-align:center;color:var(--muted);transition:.2s}
.drop.over{border-color:var(--acc);background:var(--acc2)}

/* monitor */
table.mon{border-collapse:separate;border-spacing:4px;width:100%}
table.mon th{font-weight:500;font-size:.82em;color:var(--muted);text-align:left;padding:.2em .4em;vertical-align:bottom}
table.mon td{padding:0}
table.mon td.name{padding:.3em .6em;white-space:nowrap;cursor:pointer;border-radius:10px}
table.mon td.name:hover{background:var(--soft)}
.cell{height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.84em;cursor:pointer;transition:transform .15s}
.cell:hover{transform:scale(1.06)}
.stat{font-size:2em;font-weight:300}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1em}

/* student work */
.msstrip{display:flex;gap:.5em;padding:.7em 1.2em;overflow-x:auto;border-bottom:1px solid var(--line);background:#fff}
.mschip{display:flex;align-items:center;gap:.55em;border:1px solid var(--line);border-radius:999px;padding:.3em .9em .3em .35em;cursor:pointer;white-space:nowrap;transition:.2s;background:#fff;flex:none}
.mschip.on{border-color:var(--acc);background:var(--acc2)}
.mschip.lock{opacity:.4;cursor:not-allowed}
.ring{width:26px;height:26px;flex:none}
.work{display:grid;grid-template-columns:minmax(330px,420px) 1fr;height:calc(100vh - 56px - 55px);min-height:480px}
.work.hasbanner{height:calc(100vh - 56px - 55px - 52px)}
@media(max-width:900px){.work,.work.hasbanner{grid-template-columns:1fr;height:auto}.chatcol{height:70vh}.canvascol{height:80vh}}
.chatcol{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.chatlog{flex:1;overflow-y:auto;padding:1.2em 1.1em .6em;display:flex;flex-direction:column;gap:.75em;min-height:0}
.msg{max-width:88%;padding:.65em .95em;border-radius:18px;animation:fade .45s var(--ease) both;white-space:pre-wrap;word-wrap:break-word}
.msg.ai{background:var(--soft);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg.other{background:#eef1f8;align-self:flex-end;border-bottom-right-radius:6px}
.msg .who{font-size:.75em;opacity:.65;margin-bottom:.15em}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:.85em;text-align:center;padding:.2em}
.typing{align-self:flex-start;color:var(--muted);padding:.3em .9em}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.fsug{margin-top:.6em;background:#fff;border:1px solid var(--line);border-radius:12px;padding:.6em .75em;font-size:.92em;white-space:normal}
.fsug b{display:block;margin-bottom:.2em}
.chatform{display:flex;gap:.5em;padding:.8em 1em 1em;border-top:1px solid var(--line);align-items:flex-end}
.chatform textarea{resize:none;border-radius:20px;max-height:160px;padding:.6em 1em}
.chatform button{width:42px;height:42px;padding:0;border-radius:50%;flex:none;font-size:1.1em}
.canvascol{display:flex;flex-direction:column;min-height:0;background:var(--soft2)}
.canvashead{display:flex;align-items:center;gap:.6em;padding:.7em 1em;border-bottom:1px solid var(--line);background:#fff}
.pad{flex:1;border:none;border-radius:0;padding:1.4em 1.6em;font-size:1.05em;line-height:1.6;resize:none;background:#fff;min-height:0}
.pad:focus{box-shadow:none}
#drawwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.tools{display:flex;gap:.4em;padding:.5em 1em;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.dot.on{box-shadow:0 0 0 2px var(--ink)}
#cv{flex:1;width:100%;min-height:0;touch-action:none;background:#fff;cursor:crosshair;display:block}
.banner{display:flex;align-items:center;gap:.8em;padding:.75em 1.2em;background:var(--acc2);color:var(--acc);min-height:52px;animation:fade .5s var(--ease) both}
.banner b{color:var(--ink)}

/* drawer */
.drawer-scrim{position:fixed;inset:0;background:rgba(20,24,33,.18);z-index:50;animation:fadeOnly .25s both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:#fff;z-index:51;box-shadow:-10px 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column;animation:slide .4s var(--ease) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer .dh{display:flex;align-items:center;gap:.6em;padding:1em 1.2em;border-bottom:1px solid var(--line)}
.drawer .db{flex:1;overflow:auto;padding:1em 1.2em}
.fitem{border:1px solid var(--line);border-radius:14px;padding:.8em .95em;margin-bottom:.7em;animation:fade .4s var(--ease) both}
.fitem img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:.4em}
.mat{border:1px solid var(--line);border-radius:14px;padding:.9em 1em;margin-bottom:.8em}
.mat img,.mat video{max-width:100%;border-radius:10px}
.mat .txt{white-space:pre-wrap;max-height:340px;overflow:auto;font-size:.95em}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,24,33,.25);z-index:60;display:flex;align-items:center;justify-content:center;padding:1em;animation:fadeOnly .25s both}
.modal{background:#fff;border-radius:22px;padding:1.6em 1.7em;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.18)}
.modal.wide{width:min(900px,100%)}
.modal h2{margin-bottom:.4em}
.modal .actions{display:flex;gap:.6em;justify-content:flex-end;margin-top:1.4em;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:1.6em;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:.5em;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:.6em 1.2em;border-radius:999px;font-size:.92em;animation:fade .35s var(--ease) both;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.timer{font-variant-numeric:tabular-nums;font-size:1.6em;font-weight:300}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:.2em}
.seg button{border:none;background:transparent;padding:.4em 1em}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg button.on.ink{background:var(--ink);color:#fff}
.logline{padding:.35em 0;border-bottom:1px solid var(--line);font-size:.92em}
.logline:last-child{border:none}
details summary{cursor:pointer;color:var(--muted);font-size:.9em;margin:.4em 0}
.empty{color:var(--muted);text-align:center;padding:2.5em 1em}
.ai-out{white-space:pre-wrap;line-height:1.55}
/* Schaubilder */
.visual{align-self:stretch;border:1px solid var(--line);border-radius:16px;background:#fff;padding:.8em .9em 1em;animation:fade .5s var(--ease) both;box-shadow:0 4px 18px rgba(29,36,51,.04)}
.v-head{display:flex;align-items:center;gap:.4em;margin-bottom:.7em}
.v-head b{font-size:.98em}
.v-body{font-size:.93em}
.vblank{display:inline-block;border:1.5px dashed var(--acc);background:var(--acc2);border-radius:8px;padding:.15em .45em;min-width:7em;width:auto;font:inherit;color:var(--ink);box-shadow:none}
input.vblank{width:100%;min-width:0}
input.vblank:focus{border-style:solid;box-shadow:0 0 0 3px var(--acc2)}
.vblank.filled{border-style:solid}
.v-tl{position:relative;padding-left:1.1em}
.v-tl:before{content:"";position:absolute;left:.3em;top:.4em;bottom:.4em;width:2px;background:var(--acc3)}
.v-tl-it{position:relative;padding:.15em 0 .6em .6em}
.v-tl-it:before{content:"";position:absolute;left:-1.05em;top:.45em;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px #fff}
.v-tl-it b{color:var(--acc)}
.v-py{display:flex;flex-direction:column;align-items:center;gap:4px}
.v-py>div{background:var(--soft);border-radius:8px;padding:.45em .6em;text-align:center;transition:.3s}
.v-py>div:nth-child(1){background:var(--acc3)}
.v-py>div small{display:block;color:var(--muted);margin-top:.15em}
.v-ch{display:flex;flex-direction:column;align-items:stretch;gap:0}
.v-ch .box{background:var(--soft);border-radius:10px;padding:.5em .7em}
.v-ch .arr{text-align:center;color:var(--acc);line-height:1.3;font-size:1.1em}
.v-ch .box b{display:block}
.v-cmp{width:100%;border-collapse:separate;border-spacing:3px}
.v-cmp th{font-weight:600;font-size:.9em;padding:.35em .5em;background:var(--acc2);color:var(--acc);border-radius:8px;text-align:left}
.v-cmp td{padding:.35em .5em;background:var(--soft);border-radius:8px;vertical-align:top}
.v-cmp td.lab{background:transparent;color:var(--muted);font-size:.88em;padding-left:0}
.v-mm{display:flex;flex-direction:column;align-items:center;gap:.6em}
.v-mm .c{background:var(--ink);color:#fff;border-radius:999px;padding:.45em 1.1em;font-weight:600}
.v-mm .br{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.45em;width:100%}
.v-mm .br>div{background:var(--soft);border-radius:10px;padding:.45em .6em;border-top:3px solid var(--acc3)}
.v-mm .br small{display:block;color:var(--muted)}
.v-wg{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.v-wg>div{background:var(--soft);border-radius:12px;padding:.55em .7em}
.v-wg h4{margin:0 0 .4em;font-size:.9em}
.v-wg ul{margin:0;padding-left:1.1em}
.v-wg li{margin:.25em 0}
.v-actions{display:flex;gap:.4em;flex-wrap:wrap;margin-top:.8em}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   SOKRATES – KI-Coach für Verstehen (Prototyp)
   Daten: lokal im Browser (localStorage). KI: Claude (im Artifact),
   Mistral (EU, eigener API-Schlüssel) oder Offline-Demo.
   ============================================================ */

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>Date.now();
const fmtTime=t=>new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const app=$('#app');

function toast(t,ms=2600){const d=document.createElement('div');d.textContent=t;$('#toast').appendChild(d);setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity=0;setTimeout(()=>d.remove(),400)},ms)}
function modal(html,{wide=false,onClose,sticky=false}={}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="scrim"><div class="modal ${wide?'wide':''} fade">${html}</div></div>`;
  if(!sticky)root.firstChild.addEventListener('mousedown',e=>{if(e.target.classList.contains('scrim')){closeModal();onClose&&onClose()}});
  return root.querySelector('.modal');
}
function closeModal(){$('#modal-root').innerHTML=''}
function confirmBox(text,ok='OK'){return new Promise(res=>{const m=modal(`<h2>Sicher?</h2><p>${esc(text)}</p><div class="actions"><button data-x>Abbrechen</button><button class="bp" data-ok>${esc(ok)}</button></div>`);
  m.querySelector('[data-x]').onclick=()=>{closeModal();res(false)};m.querySelector('[data-ok]').onclick=()=>{closeModal();res(true)}})}
function drawer(html){const r=$('#drawer-root');r.innerHTML=`<div class="drawer-scrim"></div><div class="drawer">${html}</div>`;r.firstChild.onclick=closeDrawer;return r.querySelector('.drawer')}
function closeDrawer(){$('#drawer-root').innerHTML=''}

/* ---------------- Speicher ---------------- */
const KEY='sokrates_v1', SKEY='sokrates_settings';
const VERSION='9';
const WORKER_URL='https://late-dust-70f5.zedtheleppelin.workers.dev';
let S=null, memStore={};
function lsGet(k){if(k in memStore)return memStore[k];try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);delete memStore[k];return true}catch(e){memStore[k]=v;return false}}
let lastSaved='';
/* Großer Speicher: IndexedDB (mehrere hundert MB), Abgleich zwischen Tabs per BroadcastChannel */
let IDB=null,BC=null,rev=0;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('sokrates',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);setTimeout(()=>res(null),4000)}catch(e){res(null)}})}
function idbGet(k){return new Promise(res=>{try{const q=IDB.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function idbSet(k,v){return new Promise(res=>{try{const tx=IDB.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}})}
function persist(){clearTimeout(pTimer);const str=JSON.stringify(S);lastSaved=str;
  if(IDB){idbSet(KEY,str).then(ok=>{if(!ok&&!persist.warned){persist.warned=true;toast('Speichern fehlgeschlagen – Browser-Speicher voll?',5000)}if(ok&&BC)try{BC.postMessage(++rev)}catch(_){}});return}
  if(!lsSet(KEY,str)&&!persist.warned){persist.warned=true;toast('Speicher voll – Änderungen gelten nur, bis du die Seite schließt.',5000)}}
let pTimer=null;function persistSoon(){clearTimeout(pTimer);pTimer=setTimeout(persist,400)}
async function loadState(){
  IDB=await idbOpen();
  try{BC=new BroadcastChannel('sokrates');BC.onmessage=async()=>{const str=await idbGet(KEY);if(str&&str!==lastSaved){try{S=JSON.parse(str);lastSaved=str;onExternalChange()}catch(_){}}}}catch(e){BC=null}
  let str=IDB?await idbGet(KEY):null;
  if(!str){str=lsGet(KEY);if(str&&IDB){await idbSet(KEY,str);try{localStorage.removeItem(KEY)}catch(_){}}}
  if(str){try{S=JSON.parse(str);lastSaved=str;return}catch(e){}}
  S=seed();persist()}
function settings(){const d={provider:'auto',key:'',model:'mistral-large-2512',base:WORKER_URL};let o;try{o=Object.assign(d,JSON.parse(lsGet(SKEY)||'{}'))}catch(e){o=d}
  // Ohne eigenen Schlüssel immer über den eingebauten Zwischenserver
  if(!o.key&&(!o.base||/api\.mistral\.ai/.test(o.base)))o.base=WORKER_URL;
  if(o.v!==VERSION){o.provider='auto';o.v=VERSION}
  return o}

/* ---------------- Demo-Daten ---------------- */
const DEMO_CANON=`Absolutismus bezeichnet eine Herrschaftsform des 17. und 18. Jahrhunderts, in der der Monarch beansprucht, ungebunden von Ständen, Parlamenten und Gesetzen („legibus solutus“) zu regieren. Begründet wurde dieser Anspruch mit dem Gottesgnadentum: Der König verstand sich als von Gott eingesetzt und nur ihm verantwortlich. Als Musterbeispiel gilt Ludwig XIV. von Frankreich (Regierungszeit 1661–1715). Kennzeichen seiner Herrschaft waren die Zentralisierung der Verwaltung durch vom König abhängige Beamte (Intendanten), ein stehendes Heer, eine merkantilistische Wirtschaftspolitik (Förderung von Manufakturen und Exporten, Schutzzölle, um möglichst viel Geld ins Land zu holen) sowie der prachtvolle Hof von Versailles, an dem der Adel unter Aufsicht gehalten und durch Zeremoniell an den König gebunden wurde. In der Praxis blieb die Macht des Königs allerdings begrenzt: Er war auf die Mitwirkung von Adel, Kirche und regionalen Eliten angewiesen. Die Forschung spricht deshalb vom Absolutismus eher als Anspruch denn als vollständig verwirklichter Realität.

Die Aufklärung ist eine geistige Bewegung des 18. Jahrhunderts. Immanuel Kant bestimmte sie 1784 als „Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit“; Unmündigkeit meint das Unvermögen, sich seines Verstandes ohne Leitung eines anderen zu bedienen. Zentrale Gedanken der Aufklärer waren der Vorrang der Vernunft gegenüber Tradition und kirchlicher Autorität, religiöse Toleranz, die Idee natürlicher Rechte aller Menschen, die Kritik an Folter und grausamen Strafen sowie – etwa bei John Locke und Montesquieu – die Vorstellung, dass Herrschaft durch einen Vertrag mit den Beherrschten legitimiert und durch Gewaltenteilung begrenzt werden solle. Jean-Jacques Rousseau ging noch weiter und sah das Volk als eigentlichen Souverän.

Als „aufgeklärter Absolutismus“ wird eine Regierungspraxis bezeichnet, bei der Monarchen Ideen der Aufklärung aufgriffen, ohne ihre unbeschränkte Herrschaft aufzugeben. Reformen sollten „von oben“ erfolgen. Als wichtigste Vertreter gelten Friedrich II. von Preußen (1740–1786), Joseph II. von Österreich und Katharina II. von Russland.

Friedrich II. stand mit Voltaire im Briefwechsel und schrieb als Kronprinz den „Antimachiavel“, in dem er einen Herrscher forderte, der dem Wohl der Untertanen dient. Er bezeichnete sich als „ersten Diener des Staates“. Damit wurde der Staat zu einer Größe über der Person des Königs; das Gottesgnadentum trat in den Hintergrund, die Herrschaft blieb aber unumschränkt. Kurz nach seinem Regierungsantritt 1740 schränkte er die Folter stark ein (bis auf wenige Ausnahmen, die später ebenfalls fielen). Er gewährte weitgehende religiöse Toleranz („Jeder soll nach seiner Façon selig werden“) und holte Glaubensflüchtlinge und Kolonisten ins Land. Er förderte die Landwirtschaft (Trockenlegung des Oderbruchs, Anbau der Kartoffel), ließ die Justiz reformieren – bekannt ist der Fall des Müllers Arnold, in den der König allerdings selbst eingriff und damit die Unabhängigkeit der Richter verletzte – und gab das Allgemeine Landrecht in Auftrag, das 1794 nach seinem Tod in Kraft trat. Das Landrecht schuf ein einheitliches Recht für Preußen, bestätigte aber die Ständeordnung.

Die Grenzen der Reformen sind deutlich: Die ständische Gesellschaft blieb bestehen; der Adel behielt seine Vorrechte und stellte die Offiziere. Auf dem Land blieben Erbuntertänigkeit und Gutsherrschaft erhalten; Bauern waren weiterhin zu Diensten verpflichtet. Eine Beteiligung der Untertanen an der Herrschaft oder eine Gewaltenteilung war nicht vorgesehen. Preußen blieb ein stark militarisierter Staat: Ein großer Teil der Staatseinnahmen floss in das Heer. Friedrich II. führte zudem Angriffskriege, etwa den Ersten Schlesischen Krieg (1740–1742) gegen Österreich, und war im Siebenjährigen Krieg (1756–1763) Kriegspartei. 1772 beteiligte sich Preußen an der Ersten Teilung Polens. Die Zensur wurde zwar gelockert, aber nicht abgeschafft.

In der Geschichtswissenschaft ist die Bewertung umstritten. Manche Historiker betonen die Modernisierung von Verwaltung, Recht und Wirtschaft und sehen in Friedrich II. einen Reformer, der Preußen zu einem effizienten Staat machte. Andere halten den Begriff „aufgeklärter Absolutismus“ für widersprüchlich, weil die Aufklärung die Mündigkeit der Menschen anstrebt, der Absolutismus sie aber gerade verhindert. Sie sprechen deshalb eher von einem „Reformabsolutismus“, der Ideen der Aufklärung nutzte, um die Macht des Staates zu steigern. Für ein eigenes Urteil ist es wichtig, zwischen einem Sachurteil (Was hat Friedrich getan, und in welchem Verhältnis stand das zu den Ideen der Aufklärung?) und einem Werturteil (Wie bewerte ich das aus heutiger Sicht, nach welchen Maßstäben?) zu unterscheiden.`;

const AI={sample:null,images:false};
(async()=>{try{if(window.claude&&typeof window.claude.use==='function'){const s=await window.claude.use('sample');if(s){AI.sample=s;try{const l=await s.limits();AI.images=!!(l&&l.images)}catch(e){}}}}catch(e){}refreshAIBadge()})();
function mistralReady(st){return !!(st.key||(st.base&&!/api\.mistral\.ai/.test(st.base)))}
function provider(){const st=settings();if(st.provider==='auto')return AI.sample?'claude':(mistralReady(st)?'mistral':'offline');if(st.provider==='claude'&&!AI.sample)return mistralReady(st)?'mistral':'offline';if(st.provider==='mistral'&&!mistralReady(st))return 'offline';return st.provider}
function providerLabel(){return {claude:'KI: Claude',mistral:'KI: Mistral (EU)',offline:'KI: Offline-Demo'}[provider()]}
function refreshAIBadge(){$$('[data-aibadge]').forEach(e=>{e.textContent=providerLabel();e.className='chip '+(provider()==='offline'?'warn':'ok')})}
function normalizeMsgs(msgs){const out=[];for(const m of msgs){if(out.length&&out[out.length-1].role===m.role)out[out.length-1].content+='\n\n'+m.content;else out.push({...m})}if(out.length&&out[0].role!=='user')out.unshift({role:'user',content:'(Beginn des Gesprächs)'});if(!out.length||out[out.length-1].role!=='user')out.push({role:'user',content:'(weiter)'});return out}
function parseJSON(t){if(t&&typeof t==='object')return t;t=String(t||'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('Keine JSON-Antwort');return JSON.parse(t.slice(a,b+1))}
function dataURLtoBlob(d){const[h,b]=d.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
function explainError(e){const m=String(e&&e.message||e||'');
  if(e&&e.code==='not_granted')return 'Der KI-Zugriff wurde nicht erlaubt.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return `Der Zwischenserver hat die Anfrage abgewiesen oder ist nicht erreichbar. Meist stimmt bei Cloudflare ALLOWED_ORIGIN nicht. Dort muss genau stehen: ${location.origin}`;
  if(/ 401/.test(m))return 'Mistral lehnt den Schlüssel ab (401). Prüfe MISTRAL_API_KEY bei Cloudflare und ob der Experiment-Tarif aktiviert ist.';
  if(/ 403/.test(m))return `Mistral verweigert den Zugriff (403, Modell: ${settings().model}). Meist ist das Modell im Tarif nicht enthalten. Originalmeldung: „${m.replace(/^.*? 403 /,'').slice(0,160)}“`;
  if(/ 429/.test(m)){const raw=(m.match(/"message"\s*:\s*"([^"]+)"/)||[])[1]||m.replace(/^.*? 429 /,'');return `Mistral meldet 429 (Modell: ${settings().model}). Originalmeldung: „${raw.slice(0,160)}“`}
  return m.slice(0,200)}
async function ask(system,messages,{json=false,image=null,tier='default',fallback}={}){
  const p=provider();AI.lastError=null;
  const fmt=json?'\n\nAntworte ausschließlich mit einem gültigen JSON-Objekt, ohne Markdown, ohne Text davor oder danach.':'';
  if(typeof messages==='string')messages=[{role:'user',content:messages}];
  try{
    if(p==='claude'){
      const msgs=normalizeMsgs([{role:'user',content:'SYSTEMANWEISUNG:\n'+system+fmt},{role:'assistant',content:'Verstanden.'},...messages]);
      const opts={modelTier:tier,cache:false};
      if(image&&AI.images)opts.images=[dataURLtoBlob(image)];
      const r=await AI.sample(msgs,opts);
      return json?parseJSON(r.text):r.text;
    }
    if(p==='mistral'){
      const st=settings();
      const body={model:st.model||'mistral-large-2512',messages:[{role:'system',content:system+fmt},...normalizeMsgs(messages)],temperature:.35};
      if(json)body.response_format={type:'json_object'};
      const url=(st.base||'https://api.mistral.ai/v1').replace(/\/$/,'')+'/chat/completions';
      const go=()=>fetch(url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},st.key?{'Authorization':'Bearer '+st.key}:{}),body:JSON.stringify(body)});
      let r=await go();
      // Bei knappen Gratis-Limits (429) bis zu zweimal geduldig erneut versuchen
      for(let i=0;i<2&&r.status===429;i++){toast('Die KI ist gerade ausgelastet – SOKRATES versucht es gleich noch einmal …',4000);await new Promise(z=>setTimeout(z,(i+1)*15000));r=await go()}
      if(!r.ok)throw new Error('Mistral: '+r.status+' '+(await r.text()).slice(0,400));
      const d=await r.json();const t=d.choices[0].message.content;
      return json?parseJSON(t):t;
    }
  }catch(e){
    console.warn(e);AI.lastError=explainError(e);
    if(e&&e.code==='not_granted')toast('KI-Zugriff wurde nicht erlaubt – Offline-Demo aktiv.');
    else if(e&&e.code==='rate_limited')toast('Die KI ist gerade ausgelastet. Kurz warten.');
    else toast('KI nicht erreichbar – Grund steht im Chat.',4000);
  }
  if(p!=='offline'&&!AI.lastError)AI.lastError='Unbekannter Fehler.';
  if(p==='offline')AI.lastError=null;
  await new Promise(r=>setTimeout(r,600));
  if(fallback)return fallback();
  return json?{}:'(Offline-Demo: Hier stünde die Antwort der KI. In den Einstellungen kannst du eine KI verbinden.)';
}

const STOP=new Set('der die das und oder ein eine einer eines den dem des ist sind war waren in im zu zur zum mit von für auf an als auch es sich nicht wie was wer bei aus nach über unter so dass daß sie er wir ihr ich du man noch nur hat haben wird werden kann'.split(' '));
const toks=t=>new Set(String(t).toLowerCase().replace(/[^a-zäöüß0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3&&!STOP.has(w)));
function canonContext(ser,query,max=9000){
  const chunks=[];ser.canon.forEach(c=>{const t=c.text||'';for(let i=0;i<t.length;i+=1100)chunks.push({src:c.title,t:t.slice(i,i+1250)})});
  const total=ser.canon.reduce((a,c)=>a+(c.text||'').length,0);
  if(total<=max)return ser.canon.map(c=>`[${c.title}]\n${c.text}`).join('\n\n');
  const q=toks(query);const sc=chunks.map((c,i)=>{const tt=toks(c.t);let s=0;q.forEach(w=>{if(tt.has(w))s++});return{c,i,s}}).sort((a,b)=>b.s-a.s);
  const out=[];let len=0;for(const x of sc){if(len+x.c.t.length>max)break;out.push(x);len+=x.c.t.length}
  out.sort((a,b)=>a.i-b.i);return out.map(x=>`[${x.c.src}] …${x.c.t}…`).join('\n\n');
}

function topbar(ctx,right=''){return `<div class="top"><span class="brand" style="cursor:pointer" data-home>SOKRATES</span><span class="muted">·</span><span class="ctx">${ctx}</span><span class="spacer"></span>${right}<span data-aibadge class="chip">…</span><button class="bg bs" data-settings title="Einstellungen">⚙︎</button><button class="bg bs" data-logout>Rolle wechseln</button></div>`}
function bindTop(){$$('[data-settings]').forEach(b=>b.onclick=openSettings);$$('[data-logout]').forEach(b=>b.onclick=()=>{ui.role=null;ui.serId=null;ui.sid=null;closeDrawer();renderStart()});$$('[data-home]').forEach(b=>b.onclick=()=>ui.role==='teacher'?renderTeacherHome():ui.sid?renderStudentHome():renderStart());refreshAIBadge()}

function renderStart(){
  ui.view='start';
  app.innerHTML=`<div class="start">
    <div class="column"></div>
    <div class="logo">SOKRATES</div>
    <div class="claim">Verstehen statt auswendig lernen.</div>

}

function editClass(s){
  const list=S.classes[s.klasse]||[];
  const m=modal(`<h2>Klasse ${esc(s.klasse)}</h2><p class="muted small">Ein Name pro Zeile. Schüler:innen melden sich mit Klasse und Namen an – ohne Konto.</p>

  <div class="actions"><button data-x>Abbrechen</button><button class="bp" id="ok">Speichern</button></div>`);
  m.querySelector('[data-x]').onclick=closeModal;
  $('#ok',m).onclick=()=>{const kn=$('#kn',m).value.trim()||s.klasse;const names=$('#names',m).value.split('\n').map(x=>x.trim()).filter(Boolean);
    const old=S.classes[s.klasse]||[];const nl=names.map(n=>old.find(o=>o.name===n)||{id:uid(),name:n});
    if(kn!==s.klasse){delete S.classes[s.klasse];S.series.forEach(x=>{if(x.klasse===s.klasse)x.klasse=kn})}
    S.classes[kn]=nl;s.klasse=kn;persist();closeModal();renderTeacherSeries()};
}

async function addCanonFiles(s,files){
  for(const f of files){
    try{
      let text='';
      if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){toast('Lese PDF „'+f.name+'“ …');text=await pdfText(f)}
      else text=await f.text();
      text=text.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
      if(!text){toast('Kein Text in „'+f.name+'“ gefunden (gescanntes PDF?)',4000);continue}
      s=live(s);s.canon.push({id:uid(),title:f.name.replace(/\.[^.]+$/,''),text});
    }catch(e){console.warn(e);toast('Konnte „'+f.name+'“ nicht lesen.')}
  }
  s=live(s);persist();renderPlan(s);if(s.canon.reduce((a,c)=>a+(c.text||'').length,0)>3e6)toast('Großer Kanon – SOKRATES nutzt jeweils die passendsten Abschnitte.',4000);
}
let pdfjsReady=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function pdfText(file){
  if(!pdfjsReady)pdfjsReady=(async()=>{const v='3.11.174';await loadScript(`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${v}/pdf.min.js`);await loadScript(`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${v}/pdf.worker.min.js`);window.pdfjsLib.GlobalWorkerOptions.workerSrc=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${v}/pdf.worker.min.js`})();
  await pdfjsReady;
  const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let out='';for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const c=await pg.getTextContent();out+=c.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('')+'\n\n'}
  return out;
}

  $$('[data-ms]',L).forEach(box=>{
    const m=s.milestones.find(x=>x.id===box.dataset.ms);
    $$('[data-mf]',box).forEach(i=>{i.oninput=i.onchange=()=>{liveMs(s,m)[i.dataset.mf]=i.value;persistSoon()}});
    $('[data-del]',box).onclick=async()=>{if(await confirmBox(`Meilenstein „${m.title}“ entfernen?`,'Entfernen')){s.milestones=s.milestones.filter(x=>x!==m);persist();renderMsList(s)}};
    const up=$('[data-up]',box);up.onclick=()=>{const i=s.milestones.indexOf(m);if(i>0){[s.milestones[i-1],s.milestones[i]]=[s.milestones[i],s.milestones[i-1]];persist();renderMsList(s)}};
    $('[data-gensample]',box).onclick=async e=>{const b=e.target;b.disabled=true;b.textContent='SOKRATES denkt nach …';
      const r=await ask(`Du bist didaktischer Assistent einer Lehrkraft. Formuliere einen knappen, fachlich präzisen Erwartungshorizont (Musterlösung in Stichpunkten, 60–120 Wörter) für einen Meilenstein einer Unterrichtsreihe. Stütze dich ausschließlich auf den Kanon.\n\nKANON:\n${canonContext(s,m.title+' '+m.goal)}`,
        `Leitfrage der Reihe: ${s.leitfrage}\nKlasse: ${s.klasse}\nMeilenstein: ${m.title} (${m.kind})\nZiel: ${m.goal}\n\nGib {"sample":"…","starter":"eine einladende, alltagsnahe Einstiegsfrage","advanced":"eine anspruchsvolle Vertiefungsfrage"} zurück.`,
        {json:true,fallback:()=>({sample:'(Offline-Demo) Stichpunkte des Erwartungshorizonts erscheinen hier, sobald eine KI verbunden ist.'})});
      {const mm=liveMs(s,m);if(r.sample)mm.sample=r.sample;if(r.starter&&!mm.starter)mm.starter=r.starter;if(r.advanced&&!mm.advanced)mm.advanced=r.advanced}s=live(s);persist();renderMsList(s);toast('Erwartungshorizont ergänzt')};
    $('[data-path]',box).oninput=e=>{liveMs(s,m).path=e.target.value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]).map(a=>({title:a[0],kern:a[1]||'',beispiel:a[2]||'',fehl:a[3]||''}));persistSoon()};
    $('[data-genpath]',box).onclick=async e=>{const b=e.target;b.disabled=true;b.textContent='SOKRATES zerlegt …';const steps=await aiPath(s,liveMs(s,m));s=live(s);if(steps.length){liveMs(s,m).path=steps;persist();renderMsList(s);toast('Lernpfad erzeugt')}else{b.disabled=false;b.textContent='✦ Lernpfad erzeugen';toast('Kein Lernpfad erhalten.')}};
    $$('[data-delmat]',box).forEach(b=>b.onclick=()=>{m.material=m.material.filter(x=>x.id!==b.dataset.delmat);persist();renderMsList(s)});
    $('[data-addtext]',box).onclick=()=>{const md=modal(`<h2>Textmaterial</h2><label>Titel</label><input id="mt"><label>Text</label><textarea id="mx" rows="10"></textarea><div class="actions"><button data-x>Abbrechen</button><button class="bp" id="ok">Hinzufügen</button></div>`,{wide:true});md.querySelector('[data-x]').onclick=closeModal;$('#ok',md).onclick=()=>{if(!$('#mx',md).value.trim())return;liveMs(s,m).material.push({id:uid(),type:'text',title:$('#mt',md).value||'Text',content:$('#mx',md).value});persist();closeModal();renderMsList(s)}};
    $('[data-addfile]',box).onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>4e6){toast('Datei zu groß für die lokale Demo (max. 4 MB).');return}
      const r=new FileReader();r.onload=()=>{const type=f.type.startsWith('image')?'image':f.type.startsWith('audio')?'audio':'video';liveMs(s,m).material.push({id:uid(),type,title:f.name,content:r.result});persist();renderMsList(s)};r.readAsDataURL(f)};
  });
}

const RLP_HINTS=`HINTERGRUND RAHMENLEHRPLAN (Berlin-Brandenburg, Jahrgangsstufen 1–10, Teil C): Kompetenzentwicklung über Niveaustufen A–H; in 7/8 meist etwa D–F, am Ende von Jahrgang 10 am Gymnasium in der Regel G/H. Geschichte 7–10: Kompetenzbereiche Deuten, Analysieren, Methoden anwenden, Urteilen, Darstellen (historisch erzählen); Inhalte in Modulen je Doppeljahrgangsstufe. Operatoren nach Anforderungsbereichen: I wiedergeben/beschreiben, II erklären/analysieren/vergleichen, III beurteilen/bewerten/Stellung nehmen. Für andere Bundesländer und Fächer gilt der jeweilige Lehrplan.
EHRLICHKEIT: Nenne Themenfelder, Module, Kompetenzbereiche und Standards nur so, wie sie im RLP-Auszug der Lehrkraft stehen oder wie du sie sicher kennst. Alles Unsichere kennzeichnest du mit „(am RLP prüfen)“. Erfinde keine Nummern und keine wörtlichen Zitate.`;
function planContext(s,maxCanon=8000){
  return `Fach: ${s.fach||'(nicht angegeben)'}
Klasse: ${s.klasse}
Bundesland/Lehrplan: ${s.bundesland||'Berlin/Brandenburg'}
Niveaustufe: ${s.niveau||'(nicht angegeben)'}
Thema: ${s.thema||s.title||'(nicht angegeben)'}
Leitfrage: ${s.leitfrage||'(noch offen)'}
Didaktisches Ziel: ${s.ziel||'(noch offen)'}
Bezug zum RLP: ${s.rlpBezug||'(noch offen)'}
${s.rlp?`\nRAHMENLEHRPLAN-AUSZUG DER LEHRKRAFT (verbindlich):\n${s.rlp.slice(0,12000)}\n`:''}
${s.canon.length?`KANON (Auszug):\n${canonContext(s,(s.thema||'')+' '+(s.leitfrage||''),maxCanon)}`:'KANON: noch keine Literatur hinterlegt – stütze dich auf gesichertes Fachwissen.'}`;
}
const PLANNER='Du bist ein erfahrener didaktischer Planungsassistent für Lehrkräfte an deutschen Schulen. Du arbeitest präzise, fachlich korrekt und kompetenzorientiert; deine Vorschläge sollen sich wie abgenommene Arbeit anfühlen, nicht wie Mehrarbeit.\n\n'+RLP_HINTS;

async function aiLeitfragen(s){
  const r=await ask(PLANNER+`\n\nAUFGABE: Formuliere Leitfragen für eine Unterrichtsreihe. Gute Leitfragen sind problemorientiert und offen (urteilsfähig statt bloßer Wissensfrage), altersgerecht, über mehrere Stunden tragfähig und am Ende von den Schüler:innen begründet beantwortbar.`,
    planContext(s)+`\n\nGib 4 unterschiedliche Vorschläge mit verschiedenen Zugängen (z. B. Urteilsfrage, Vergleich, Gegenwartsbezug, Perspektivwechsel).\nFormat: {"options":[{"leitfrage":"…","titel":"kurzer Reihentitel","zugang":"2–4 Wörter","warum":"ein Satz"}]}`,
    {json:true,tier:'complex',fallback:()=>({options:[{leitfrage:`(Offline-Demo) Leitfrage zu „${s.thema||s.title}“`,titel:s.thema||s.title,zugang:'Urteilsfrage',warum:'Mit verbundener KI stehen hier echte Vorschläge.'}]})});
  return Array.isArray(r.options)?r.options.filter(o=>o&&o.leitfrage):[];
}
async function pickLeitfrage(s){
  if(!(s.thema||s.title||'').trim()||s.title==='Neue Reihe'&&!s.thema){toast('Bitte zuerst Fach und Thema eintragen.');return}
  const m=modal(`<h2>Leitfragen-Vorschläge</h2><div id="lfo" class="muted">SOKRATES denkt nach …</div><div class="actions"><button data-x>Schließen</button><button id="again" disabled>Neue Vorschläge</button></div>`,{wide:true});
  m.querySelector('[data-x]').onclick=closeModal;
  const load=async()=>{$('#again',m).disabled=true;$('#lfo',m).innerHTML='<span class="muted">SOKRATES denkt nach …</span>';
    const o=await aiLeitfragen(s);if(!$('#lfo',m))return;
    $('#lfo',m).innerHTML=o.map((x,i)=>`<div class="card click fade" data-i="${i}" style="margin-bottom:.6em;animation-delay:${i*.06}s"><div class="row"><span class="chip acc">${esc(x.zugang||'')}</span><span class="small muted">${esc(x.titel||'')}</span></div><div style="font-size:1.1em;margin:.4em 0">${esc(x.leitfrage)}</div><div class="small muted">${esc(x.warum||'')}</div></div>`).join('')||'Keine Vorschläge erhalten.';
    $$('[data-i]',m).forEach(c=>c.onclick=()=>{const x=o[+c.dataset.i];s=live(s);s.leitfrage=x.leitfrage;if(x.titel&&(!s.title||s.title==='Neue Reihe'))s.title=x.titel;persist();closeModal();renderTeacherSeries();toast('Leitfrage übernommen')});
    $('#again',m).disabled=false};
  $('#again',m).onclick=load;load();
}
async function aiZiel(s){
  const r=await ask(PLANNER+`\n\nAUFGABE: Formuliere das didaktische Ziel der Reihe und ihren Bezug zum Rahmenlehrplan.`,
    planContext(s)+`\n\nDas Ziel: 2–3 Sätze, kompetenzorientiert mit Operatoren, nennt das Endprodukt (z. B. Essay, Urteil, Präsentation) und passt zur Klassenstufe.\nFormat: {"ziel":"…","themenfeld":"Themenfeld bzw. Modul des Lehrplans","kompetenzen":["Kompetenzbereich: konkrete Teilkompetenz", "…"],"niveau":"Niveaustufe(n)","pruefen":"was die Lehrkraft am Lehrplan gegenprüfen sollte"}`,
    {json:true,tier:'complex',fallback:()=>({ziel:'(Offline-Demo) Mit verbundener KI steht hier ein kompetenzorientiertes Ziel.',themenfeld:'(am RLP prüfen)',kompetenzen:['Urteilen: …'],niveau:'',pruefen:''})});
  return r||{};
}
function rlpText(r){return [r.themenfeld?`Themenfeld/Modul: ${r.themenfeld}`:'',Array.isArray(r.kompetenzen)&&r.kompetenzen.length?`Kompetenzen:\n${r.kompetenzen.map(k=>'• '+k).join('\n')}`:'',r.niveau?`Niveaustufe: ${r.niveau}`:'',r.pruefen?`Zu prüfen: ${r.pruefen}`:''].filter(Boolean).join('\n')}
async function fillZiel(s,btn){
  if(!s.leitfrage.trim()){toast('Bitte zuerst eine Leitfrage eintragen oder vorschlagen lassen.');return}
  btn.disabled=true;btn.textContent='SOKRATES formuliert …';
  const r=await aiZiel(s);s=live(s);
  if(r.ziel){s.ziel=r.ziel;s.rlpBezug=rlpText(r);persist();renderPlan(s);toast('Ziel und RLP-Bezug ergänzt')}else{btn.disabled=false;btn.textContent='✦ nach Rahmenlehrplan formulieren';toast('Kein Vorschlag erhalten.')}
}
async function aiMilestones(s,n,w=''){
  const r=await ask(PLANNER+`\n\nAUFGABE: Plane eine Unterrichtsreihe als Abfolge von Meilensteinen hin zum didaktischen Ziel. Mische inhaltliche Meilensteine (Begriffe, Zusammenhänge, Wissen) mit methodischen (z. B. Quellenarbeit, Urteilsbildung, Schreiben). Steigere die Anforderungen von AFB I über II zu III. Der letzte Meilenstein ist das Endprodukt (z. B. ein Essay zur Leitfrage). Stütze dich fachlich auf den Kanon. Formuliere Ziele kompetenzorientiert mit Operatoren und orientiere sie an den Kompetenzen aus dem RLP-Bezug.`,
    planContext(s,14000)+`\n\nZeitplan: ${s.timeline==='fix'?'ein Meilenstein pro Unterrichtsstunde':'loser Rahmen: '+s.timeframe}\nAnzahl Meilensteine: ${n}\nWünsche: ${w||'keine'}\n\nFormat: {"milestones":[{"title":"kurz","kind":"inhaltlich|methodisch","goal":"Ziel mit Operator","sample":"Erwartungshorizont in Stichpunkten (60–100 Wörter)","starter":"einladende, konkrete Einstiegsfrage, an einem Fall verankert, die man ohne Vorwissen beantworten kann","advanced":"anspruchsvolle Vertiefungsfrage für Schnelle","path":[{"title":"Teilschritt","kern":"was am Ende verstanden sein soll","beispiel":"konkreter Fall aus dem Kanon","fehl":"typische Fehlvorstellung"}]}]}\nDer "path" zerlegt jeden Meilenstein in 3–5 kleine, aufeinander aufbauende Teilschritte für ein sokratisches Einzelgespräch.`,
    {json:true,tier:'complex',fallback:()=>({milestones:Array.from({length:n},(_,i)=>({title:i===n-1?'Abschluss: Stellung nehmen zur Leitfrage':'Meilenstein '+(i+1),kind:i>=n-2?'methodisch':'inhaltlich',goal:'(Offline-Demo – mit verbundener KI entsteht hier ein echter Vorschlag)',sample:'',starter:'Was weißt du schon über das Thema?',advanced:''}))})});
  return Array.isArray(r.milestones)?r.milestones.map(x=>({id:uid(),title:x.title||'Meilenstein',kind:x.kind==='methodisch'?'methodisch':'inhaltlich',goal:x.goal||'',sample:x.sample||'',starter:x.starter||'',advanced:x.advanced||'',material:[],path:(Array.isArray(x.path)?x.path:[]).slice(0,6).map(y=>({title:str(y&&y.title),kern:str(y&&y.kern),beispiel:str(y&&y.beispiel),fehl:str(y&&y.fehl)})).filter(y=>y.title&&y.kern)})):[];
}
async function genMilestones(s){
  if(!s.leitfrage.trim()){toast('Bitte zuerst eine Leitfrage eintragen.');return}
  const m=modal(`<h2>Meilensteine vorschlagen</h2><p class="muted">SOKRATES plant inhaltliche und methodische Meilensteine auf dem Weg zur Leitfrage – auf Grundlage deines Kanons und des Rahmenlehrplan-Bezugs.</p>
  <label>Anzahl</label><input id="n" type="number" min="2" max="12" value="${s.timeline==='fix'?7:6}" style="width:120px">
  <label>Besondere Wünsche (optional)</label><textarea id="w" rows="3" placeholder="z. B. eine Bildanalyse einbauen, am Ende ein Essay"></textarea>
  <p class="small muted">Bestehende Meilensteine werden ersetzt.</p>
  <div class="actions"><button data-x>Abbrechen</button><button class="ba" id="go">Vorschlagen</button></div>`);
  m.querySelector('[data-x]').onclick=closeModal;
  $('#go',m).onclick=async()=>{
    const n=+$('#n',m).value||6,w=$('#w',m).value;
    $('#go',m).disabled=true;$('#go',m).textContent='SOKRATES plant …';
    const ms=await aiMilestones(s,n,w);s=live(s);
    if(ms.length){s.milestones=ms;persist();closeModal();renderPlan(s);toast(`${ms.length} Meilensteine angelegt`)}
    else{closeModal();toast('Kein brauchbarer Vorschlag – bitte erneut versuchen.')}
  };
}
async function planAll(s){
  if(!(s.fach||'').trim()||!((s.thema||'').trim()||(s.title&&s.title!=='Neue Reihe'))){toast('Bitte zuerst Fach und Thema eintragen.');return}
  const has=s.leitfrage||s.ziel||s.milestones.length;
  const m=modal(`<h2>Ganze Reihe planen</h2><p class="muted">SOKRATES ${has?'überschreibt Leitfrage, Ziel und Meilensteine und ':''}plant in drei Schritten. Danach kannst du alles ändern.</p>
    <label>Anzahl Meilensteine</label><input id="n" type="number" min="2" max="12" value="${s.timeline==='fix'?7:6}" style="width:120px">
    <label>Wünsche (optional)</label><textarea id="w" rows="2" placeholder="z. B. Endprodukt soll eine Podiumsdiskussion sein"></textarea>
    <div id="steps" style="margin-top:1em"></div>
    <div class="actions"><button data-x>Abbrechen</button><button class="ba" id="go">Planen</button></div>`);
  let cancelled=false;m.querySelector('[data-x]').onclick=()=>{cancelled=true;closeModal()};
  $('#go',m).onclick=async()=>{
    const n=+$('#n',m).value||6,w=$('#w',m).value;$('#go',m).disabled=true;
    const steps=[['lf','Leitfrage finden'],['ziel','Ziel und Bezug zum Rahmenlehrplan'],['ms','Meilensteine mit Erwartungshorizonten']];
    const draw=(cur,done)=>{const el=$('#steps',m);if(el)el.innerHTML=steps.map(([k,l],i)=>`<div class="row" style="padding:.35em 0"><span style="width:22px;text-align:center">${i<done?'✓':i===cur?'<span class="typing" style="padding:0"><i></i></span>':'·'}</span><span class="${i>cur?'muted':''}">${l}</span></div>`).join('')};
    draw(0,0);
    const opts=await aiLeitfragen(s);if(cancelled)return;s=live(s);
    if(opts[0]){s.leitfrage=opts[0].leitfrage;if(opts[0].titel)s.title=opts[0].titel}
    draw(1,1);
    const z=await aiZiel(s);if(cancelled)return;s=live(s);
    if(z.ziel){s.ziel=z.ziel;s.rlpBezug=rlpText(z)}
    draw(2,2);
    const ms=await aiMilestones(s,n,w);if(cancelled)return;s=live(s);
    if(ms.length)s.milestones=ms;
    s.lfOptions=opts.slice(1).map(o=>o.leitfrage);
    persist();draw(3,3);
    setTimeout(()=>{closeModal();renderTeacherSeries();toast('Reihe geplant – prüfe besonders den RLP-Bezug')},500);
  };
}

  const at=$('#aiTask');if(at)at.onclick=async()=>{at.disabled=true;at.textContent='…';const ms=s.milestones.find(x=>x.id===$('#phMs').value);const type=$('#phType').value;
    const r=await ask(PLANNER+'\n\nAUFGABE: Formuliere einen kurzen, klaren Arbeitsauftrag für eine kooperative Phase.',`${planContext(s,3000)}\n\nMeilenstein: ${ms?.title} – Ziel: ${ms?.goal}\nSozialform: ${type==='tsp'?'Think-Pair-Share':'Gruppenarbeit'}\n\nDer Auftrag (1–2 Sätze, mit Operator, mit konkretem Ergebnis, z. B. „Einigt euch auf …“) soll Austausch erzwingen. Format: {"auftrag":"…"}`,{json:true,fallback:()=>({auftrag:'(Offline-Demo) Sammelt gemeinsam drei Argumente zur Leitfrage und einigt euch auf das stärkste.'})});
    if(r.auftrag&&$('#phTask'))$('#phTask').value=r.auftrag;at.disabled=false;at.textContent='✦ vorschlagen'};
  const aq=$('#aiChQ');if(aq)aq.onclick=async()=>{aq.disabled=true;aq.textContent='…';const ms=s.milestones.find(x=>x.id===$('#chMs').value);
    const r=await ask(PLANNER+'\n\nAUFGABE: Formuliere eine kurze Lernstandsaufgabe (Challenge) für die ganze Klasse, die Verstehen prüft (erklären, begründen, vergleichen, anwenden).',`${planContext(s,4000)}\n\nMeilenstein: ${ms?.title}\nZiel: ${ms?.goal}\nErwartungshorizont: ${ms?.sample}\n\nFormat: {"question":"klar formulierte Aufgabe mit Operator, in 3–6 Minuten lösbar"}`,{json:true,fallback:()=>({question:`(Offline-Demo) Erkläre in eigenen Worten: ${ms?.title}`})});
    if(r.question&&$('#chQ'))$('#chQ').value=r.question;aq.disabled=false;aq.textContent='✦ vorschlagen'};
  const go=$('#phStart');if(go)go.onclick=()=>{
    const type=$('#phType').value,size=type==='tsp'?2:clamp(+$('#phSize').value||3,2,6);

    for(let i=0;i<ids.length;i+=size)groups.push({table:groups.length+1,members:ids.slice(i,i+size)});
    if(groups.length>1&&groups[groups.length-1].members.length===1){const l=groups.pop();groups[groups.length-1].members.push(...l.members)}

  $$('[data-ext]').forEach(b=>b.onclick=()=>{s.phase.endsAt=Math.max(now(),s.phase.endsAt)+(+b.dataset.ext)*1000;persist();updateLiveTimer()});
  const pe=$('#phEnd');if(pe)pe.onclick=()=>{s.phase={type:'einzel'};persist();renderTeacherSeries(true)};
  $$('[data-gchat]').forEach(b=>b.onclick=()=>{const th=(S.groupChats[s.id]||{})[s.phase.id+':'+b.dataset.gchat]||[];const m=modal(`<h2>Gruppenchat · Tisch ${+b.dataset.gchat+1}</h2>${chatTranscript(th)}<div class="actions"><button class="bp" data-x>Schließen</button></div>`,{wide:true});m.querySelector('[data-x]').onclick=closeModal});
  const cg=$('#chGo');if(cg)cg.onclick=()=>{s.challenge={id:uid(),msId:$('#chMs').value,q:$('#chQ').value.trim(),min:clamp(+$('#chMin').value||5,1,45),t:now()};persist();renderTeacherSeries(true);toast('Challenge gesendet')};
  const ce=$('#chEnd');if(ce)ce.onclick=()=>{s.challenge=null;persist();renderTeacherSeries(true)};
  updateLiveTimer();
}
function phaseRemaining(ph){if(!ph||ph.type==='einzel')return null;const t=now();if(t<ph.startsAt)return{pre:true,ms:ph.startsAt-t};return{pre:false,ms:Math.max(0,ph.endsAt-t)}}
const mmss=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function updateLiveTimer(){const el=$('#liveTimer');const s=ser();if(!el||!s)return;const r=phaseRemaining(s.phase);if(!r){el.textContent='–';return}el.textContent=(r.pre?'Start in ':'')+mmss(r.ms);el.style.color=!r.pre&&r.ms<60e3?'var(--bad)':''}

function chatTranscript(th){return `<div style="max-height:55vh;overflow:auto">${th.map(x=>`<div class="logline"><b>${x.role==='ai'?'SOKRATES':x.role==='sys'?'–':esc(x.who||'Schüler:in')}</b> <span class="muted small">${x.t?fmtTime(x.t):''}</span><div style="white-space:pre-wrap">${esc(x.text)}</div>${x.visual?`<div style="margin-top:.4em;max-width:520px">${visualCard(x.visual,x.vf||{},{readonly:true})}</div>`:''}</div>`).join('')||'<div class="empty">Noch kein Gespräch.</div>'}</div>`}

function renderMonitor(s){
  const T=$('#tbody');const st=classOf(s);const ms=s.milestones;

  const rows=st.map(x=>{const ps=ms.map(m=>peekP(x.id,s.id,m.id));const fl=ps.reduce((a,p)=>a+(p?.flags?.length||0),0);const last=Math.max(0,...ps.map(p=>p?.last||0));
    return{x,ps,fl,last,avg:avgOf(ps.map(p=>p?.p||0)),cur:cur?(peekP(x.id,s.id,cur.id)?.p||0):0}});
  const attention=rows.filter(r=>r.fl||r.cur<25||(r.last&&now()-r.last>3*864e5)).sort((a,b)=>a.cur-b.cur);
  T.innerHTML=`
  <div class="sec kpis">
    <div class="card"><div class="small muted">Klassendurchschnitt</div><div class="stat">${seriesAvg(s)} %</div></div>
    <div class="card"><div class="small muted">Meilenstein ${s.unlocked+1} erreicht (≥ 70 %)</div><div class="stat">${rows.filter(r=>r.cur>=70).length}/${rows.length}</div></div>

  </div>
  <div class="sec"><div class="row" style="margin-bottom:.7em"><h3>Fortschritt</h3><span class="spacer"></span><button class="ba" id="anaClass">✦ Wochenanalyse der Klasse</button></div>
    <div class="card" style="overflow:auto;padding:.8em">
    <table class="mon"><tr><th></th>${ms.map((m,i)=>`<th title="${esc(m.title)}">${i+1}. ${esc(m.title.length>22?m.title.slice(0,21)+'…':m.title)}</th>`).join('')}<th>⚑</th><th>Ø</th></tr>
    ${rows.map(r=>`<tr><td class="name" data-st="${r.x.id}">${esc(r.x.name)} ${s.advanced?.[r.x.id]?'<span class="chip acc" title="erhöhte Schwierigkeit">+</span>':''}</td>${r.ps.map((p,i)=>`<td><div class="cell" data-st="${r.x.id}" style="${colorFor(p?.p||0)};${i>s.unlocked?'opacity:.5':''}">${p&&(p.p||p.n)?p.p:''}</div></td>`).join('')}<td style="text-align:center">${r.fl?`<span class="chip bad">${r.fl}</span>`:''}</td><td class="small muted" style="text-align:center">${r.avg}</td></tr>`).join('')}
    </table></div>
  </div>
  <div class="sec two">
    <div><h3>Braucht diese Woche Aufmerksamkeit</h3>${attention.map(r=>`<div class="canon-item" style="cursor:pointer" data-st="${r.x.id}"><b style="min-width:80px">${esc(r.x.name)}</b><span class="small muted" style="flex:1">${[r.fl?'Hinweis auf unangemessene Nutzung':'',r.cur<25?`nur ${r.cur} % im aktuellen Meilenstein`:'',r.last&&now()-r.last>3*864e5?'seit Tagen inaktiv':''].filter(Boolean).join(' · ')}</span></div>`).join('')||'<div class="muted">Niemand – sehr schön.</div>'}</div>
    <div><h3>Hinweise</h3>${flagsOf(s).slice(0,8).map(f=>`<div class="canon-item" style="cursor:pointer" data-st="${f.sid}"><span class="chip bad">⚑</span><div class="small"><b>${esc(f.name)}</b> · ${esc(f.ms)} · ${fmtTime(f.t)}<div class="muted">${esc(f.reason)}</div></div></div>`).join('')||'<div class="muted">Keine Hinweise.</div>'}</div>
  </div>`;
  $$('[data-st]',T).forEach(e=>e.onclick=()=>studentDetail(s,e.dataset.st));

function studentDetail(s,sid){
  const x=stud(sid);
  const body=s.milestones.map((m,i)=>{const p=peekP(sid,s.id,m.id);if(!p)return `<div class="ms" style="opacity:.55"><div class="row"><span class="num">${i+1}</span><b>${esc(m.title)}</b><span class="spacer"></span><span class="small muted">noch nicht begonnen</span></div></div>`;
    return `<div class="ms"><div class="row"><span class="num">${i+1}</span><b style="flex:1">${esc(m.title)}</b>${ringSVG(p.p)}<span>${p.p} %</span></div>
      ${(m.path||[]).length?`<div class="small muted" style="margin-top:.4em">Lernpfad: Teilschritt ${Math.min((p.step||0)+1,m.path.length)} von ${m.path.length} – ${esc(m.path[Math.min(p.step||0,m.path.length-1)].title)}</div>`:''}
      ${p.diag?`<div class="row" style="margin-top:.4em">${Object.entries(p.diag).map(([k,v])=>`<span class="chip">${esc({tragfaehig:'tragfähig',vage:'vage',falsch:'falsch',einwand:'Einwand',weiss_nicht:'weiß nicht',frage_unklar:'Frage unklar',begriff_unklar:'Begriff unklar',abschweifung:'abgeschweift'}[k]||k)} ${v}</span>`).join('')}</div>`:''}
      ${p.notes.length?`<div style="margin-top:.6em"><div class="small muted">Diagnosen von SOKRATES</div>${p.notes.slice(-4).map(n=>`<div class="logline">${esc(n.text)} <span class="muted small">${fmtTime(n.t)}</span></div>`).join('')}</div>`:''}
      ${p.challenges.length?`<div style="margin-top:.6em"><div class="small muted">Challenges</div>${p.challenges.map(c=>`<div class="logline"><span class="chip ${c.score>=70?'ok':c.score>=40?'warn':'bad'}">${c.score} %</span> ${esc(c.q)}<details><summary>Antwort &amp; Feedback</summary><div style="white-space:pre-wrap">${esc(c.a)}</div><div class="muted small" style="margin-top:.3em">${esc(c.fb||'')}</div></details></div>`).join('')}</div>`:''}
      ${p.flags.length?`<div style="margin-top:.6em">${p.flags.map(f=>`<div class="logline"><span class="chip bad">⚑</span> ${esc(f.reason)} <span class="muted small">${fmtTime(f.t)}</span></div>`).join('')}</div>`:''}
      ${p.text?`<details><summary>Arbeitsfläche (Text)</summary><div style="white-space:pre-wrap" class="small">${esc(p.text)}</div></details>`:''}
      ${p.drawing&&p.drawn?`<details><summary>Arbeitsfläche (Zeichnung)</summary><img src="${p.drawing}" style="max-width:100%;border:1px solid var(--line);border-radius:10px"></details>`:''}
      ${p.chat.length?`<details><summary>Gesprächsverlauf (${p.chat.length})</summary>${chatTranscript(p.chat)}</details>`:''}
    </div>`}).join('');
  const fold=(S.folders[sid]||[]).filter(f=>f.serId===s.id);
  const m=modal(`<div class="row"><h2 style="flex:1">${esc(x.name)}</h2><label style="display:flex;gap:.5em;align-items:center;margin:0;color:var(--ink);font-size:.95em"><input type="checkbox" id="adv" style="width:auto" ${s.advanced?.[sid]?'checked':''}> Erhöhte Schwierigkeit</label></div>
    <div class="row" style="margin:.6em 0 1em"><button class="ba bs" id="ana">✦ Analyse &amp; Anpassungsvorschläge</button><span class="small muted">${fold.length} Einträge im Ordner</span></div>
    <div id="anaOut"></div>${body}<div class="actions"><button class="bp" data-x>Schließen</button></div>`,{wide:true});
  m.querySelector('[data-x]').onclick=closeModal;
  $('#adv',m).onchange=e=>{s.advanced??={};s.advanced[sid]=e.target.checked;persist();renderTeacherSeries(true)};
  $('#ana',m).onclick=async e=>{e.target.disabled=true;e.target.textContent='SOKRATES analysiert …';
    const data=s.milestones.map((ms,i)=>{const p=peekP(sid,s.id,ms.id);if(!p)return `M${i+1} ${ms.title}: nicht begonnen`;return `M${i+1} ${ms.title} (${p.p} %): Diagnosen: ${p.notes.slice(-5).map(n=>n.text).join(' | ')}; Challenges: ${p.challenges.map(c=>c.score+'% – '+c.fb).join(' | ')}; Hinweise: ${p.flags.map(f=>f.reason).join(' | ')}; letzte Schülerbeiträge: ${p.chat.filter(c=>c.role==='user').slice(-4).map(c=>c.text.slice(0,200)).join(' / ')}`}).join('\n');
    const r=await ask('Du unterstützt eine Lehrkraft bei der Lernstandsdiagnose. Schreibe auf Deutsch, knapp und konkret, ohne Floskeln. Struktur: 1) Stand in zwei Sätzen, 2) individuelle Herausforderungen, 3) zwei bis drei konkrete Anpassungen für den Unterricht oder für SOKRATES. Keine Überschriften mit #, nur kurze Absätze.',`Reihe: ${s.leitfrage}\nSchüler:in: ${x.name}\n\n${data}`,{fallback:()=>`(Offline-Demo) ${x.name} kommt im aktuellen Meilenstein voran. Mit verbundener KI steht hier eine individuelle Analyse mit Anpassungsvorschlägen.`});
    $('#anaOut',m).innerHTML=`<div class="card fade ai-out" style="background:var(--acc2);border-color:var(--acc3);margin-bottom:1em">${esc(r)}</div>`;e.target.textContent='✦ Erneut analysieren';e.target.disabled=false};
}

async function classAnalysis(s){
  const m=modal(`<h2>Wochenanalyse · ${esc(s.klasse)}</h2><div id="out" class="ai-out muted">SOKRATES fasst den Stand der Klasse zusammen …</div><div class="actions"><button class="bp" data-x>Schließen</button></div>`,{wide:true});
  m.querySelector('[data-x]').onclick=closeModal;
  const lines=classOf(s).map(x=>`${x.name}: `+s.milestones.map((ms,i)=>{const p=peekP(x.id,s.id,ms.id);return p?`M${i+1}=${p.p}%${p.flags.length?' ⚑':''}${p.notes.length?' ('+p.notes[p.notes.length-1].text+')':''}`:''}).filter(Boolean).join('; ')).join('\n');
  const r=await ask('Du unterstützt eine Lehrkraft. Fasse den Lernstand einer Klasse zusammen: 1) Gesamtbild in drei Sätzen, 2) typische Schwierigkeiten, 3) wer diese Woche besondere Aufmerksamkeit braucht und warum, 4) zwei konkrete Vorschläge für die nächste Stunde. Deutsch, knapp, keine Markdown-Überschriften.',
    `Reihe: ${s.title} – Leitfrage: ${s.leitfrage}\nMeilensteine: ${s.milestones.map((m,i)=>`M${i+1} ${m.title}`).join('; ')}\nFreigegeben bis: M${s.unlocked+1}\n\n${lines}`,

function curMs(){const s=ser();if(ui.msIdx==='side')return{id:'side',title:'Seitenpfade',kind:'frei',goal:'Freies Erkunden von Nebenaspekten und Hintergründen der Leitfrage – aus eigenem Interesse.',sample:'',starter:'Was hat dich an diesem Thema bisher überrascht oder neugierig gemacht? Dem gehen wir nach.',advanced:'',material:[]};return s.milestones[ui.msIdx]}
function inGroup(){const s=ser(),ph=s.phase;if(!ph||ph.type==='einzel'||s.mode!=='school')return null;if(now()<ph.startsAt)return null;if(!(ph.stage==='pair'||ph.stage==='work'))return null;if(ui.msIdx==='side'||curMs()?.id!==ph.msId)return null;const gi=(ph.groups||[]).findIndex(g=>g.members.includes(ui.sid));return gi<0?null:{gi,g:ph.groups[gi],key:ph.id+':'+gi}}
function thread(){const s=ser();const grp=inGroup();if(grp){S.groupChats[s.id]??={};return S.groupChats[s.id][grp.key]??=[]}return P(ui.sid,s.id,curMs().id).chat}
function pr(){return P(ui.sid,ser().id,curMs().id)}

  app.innerHTML=topbar(esc(s.leitfrage||s.title),`<span class="chip ${s.mode==='school'?'ok':''}" id="modeChip">${s.mode==='school'?'Schulmodus':'Heimmodus'}</span><button class="bs" id="matBtn">Material</button><button class="bs" id="folderBtn">Ordner</button><button class="bs" id="chBtn" title="Selbst eine Challenge anfordern">Challenge</button>`)+
  `<div id="bannerWrap"></div><div class="msstrip" id="strip"></div>

const VIS_TYPES=['zeitstrahl','pyramide','kette','vergleich','mindmap','waage'];
const isBlank=v=>typeof v==='string'&&/^\s*\?/.test(v);
const str=v=>v==null?'':String(v).slice(0,160);
function sanitizeVisual(v){
  if(!v||typeof v!=='object'||!VIS_TYPES.includes(v.type))return null;
  const it=a=>(Array.isArray(a)?a:[]).slice(0,9).map(x=>typeof x==='object'&&x?{label:str(x.label),text:str(x.text)}:{label:str(x),text:''});
  const o={type:v.type,title:str(v.title)||'Schaubild'};
  if(v.type==='vergleich'){o.columns=(Array.isArray(v.columns)?v.columns:[]).slice(0,4).map(str);o.rows=(Array.isArray(v.rows)?v.rows:[]).slice(0,8).map(r=>({label:str(r&&r.label),cells:(Array.isArray(r&&r.cells)?r.cells:[]).slice(0,4).map(str)}));if(!o.columns.length||!o.rows.length)return null}
  else if(v.type==='waage'){const side=x=>({title:str(x&&x.title),items:(Array.isArray(x&&x.items)?x.items:[]).slice(0,7).map(i=>typeof i==='object'&&i?str(i.label||i.text):str(i))});o.left=side(v.left);o.right=side(v.right);if(!o.left.items.length&&!o.right.items.length)return null}
  else{o.items=it(v.items);if(v.type==='mindmap')o.center=str(v.center)||o.title;if(!o.items.length)return null}
  return o;
}
// Lücken mit Kontext auflisten
function visualBlanks(v){const out=[];const add=(val,k,ctx)=>{if(isBlank(val))out.push({k,ctx,hint:String(val).replace(/^\s*\?\s*/,'')})};
  if(v.type==='vergleich')v.rows.forEach((r,i)=>{add(r.label,i+'.l','Kriterium '+(i+1));r.cells.forEach((c,j)=>add(c,i+'.'+j,`${r.label||'Zeile '+(i+1)} / ${v.columns[j]||'Spalte '+(j+1)}`))});
  else if(v.type==='waage'){['left','right'].forEach(sd=>v[sd].items.forEach((x,i)=>add(x,sd+'.'+i,v[sd].title||(sd==='left'?'links':'rechts'))))}
  else{if(v.type==='mindmap')add(v.center,'c','Mitte');v.items.forEach((x,i)=>{add(x.label,i+'.l',x.text&&!isBlank(x.text)?x.text:`Element ${i+1}`);add(x.text,i+'.t',x.label&&!isBlank(x.label)?x.label:`Element ${i+1}`)})}
  return out}
function visualHTML(v,vf={},{readonly=false}={}){

  else if(v.type==='waage')b=`<div style="text-align:center;margin:-.2em 0 .4em"><svg width="54" height="30" viewBox="0 0 54 30"><path d="M27 4v22M8 9h38M3 20l5-11 5 11zM41 20l5-11 5 11zM20 27h14" fill="none" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="v-wg">${['left','right'].map(sd=>`<div><h4>${esc(v[sd].title||(sd==='left'?'Dafür':'Dagegen'))}</h4><ul>${v[sd].items.map((x,i)=>`<li>${c(x,sd+'.'+i)}</li>`).join('')}</ul></div>`).join('')}</div>`;

SO FÜHRST DU DAS GESPRÄCH
1. Erst diagnostizieren, dann antworten. Ordne die letzte Schülerantwort einer Kategorie zu (Feld "diagnose") und reagiere so:
 • "tragfaehig" – richtig und mit eigenem Gedanken oder Grund: Würdige konkret, WAS gut war (ein Halbsatz). Dann vertiefen oder weiter zum nächsten Teilschritt.
 • "vage" – richtige Richtung, aber allgemein oder floskelhaft (z. B. „gemeinsam sind sie stärker“): NICHT loben. Frag nach einem konkreten Beispiel, einem Grund oder dem passenden Fachbegriff.
 • "falsch": Nicht einfach korrigieren. Biete ein konkretes Gegenbeispiel oder eine Information aus der Wissensbasis an, die den Widerspruch sichtbar macht.
 • "einwand" – die Person widerspricht, zweifelt oder findet ein Problem: Das ist wertvoll! Nimm es ausdrücklich ernst und baue darauf auf. Oft steckt im Einwand der Kern des Themas.
 • "weiss_nicht" oder "frage_unklar": Deine Frage war zu schwer oder zu abstrakt. Stell sie NICHT umformuliert noch einmal. Gib stattdessen einen kleinen Wissensbaustein (2–3 Sätze, mit einem konkreten Fall aus der Wissensbasis) und stelle dann eine leichte, konkrete Frage dazu – gern als Auswahl: „Eher A oder eher B – und warum?“
 • "begriff_unklar" – fragt, was ein Wort oder eine Abkürzung bedeutet: Erkläre es sofort, kurz und mit Beispiel. Begriffe, Abkürzungen und Fakten darfst du immer erklären. Selbst erarbeiten soll die Person Deutungen, Zusammenhänge und Urteile.
 • "abschweifung": freundlich, aber klar zurück zum Thema; bei unangemessener Nutzung zusätzlich "flag".
2. Gute Fragen sind konkret, an einem Fall oder Beispiel verankert, in ein bis zwei Sätzen beantwortbar und gehören zum aktuellen Teilschritt. Verboten sind leere Fragen wie „Was könnte das bedeuten?“, „Was denkst du darüber?“, „Was noch?“ oder „Warum ist das wichtig?“.
3. Deine Hinweise enthalten nie schon die gesuchten Antwortwörter. Lob nie, wenn die Person nur wiederholt, was du vorgegeben hast.
4. Wiederhole keine Frage, die du schon (ähnlich) gestellt hast.
5. Gib Orientierung: Wenn ein neuer Teilschritt beginnt, sag in einem halben Satz, worum es jetzt geht.
6. Ein Teilschritt ist geschafft ("step_done": true), wenn die Person seinen Kern in eigenen Worten UND mit einem konkreten Beispiel oder Grund formuliert hat. Dann leitest du zum nächsten Teilschritt über.
7. Höchstens 80 Wörter, genau eine Frage am Ende. Duzen. Sprache passend zur Klassenstufe, kurze Sätze.
8. Ordner-Vorschläge ("folder") nur für Formulierungen mit echtem Fachinhalt (Begriff, Zusammenhang mit Grund, Beispiel) – nie für Allgemeinplätze.

Schüler: „Das ist doch schwierig, weil jeder etwas anderes will.“
 schlecht: „Stimmt. Aber was wäre, wenn …“
 gut: „Genau dieses Problem ist zentral! [kurze Info, wie es im Thema gelöst oder nicht gelöst wird]. Was folgt daraus für …?“

const STUCK=/(wei(ß|ss) (ich )?(es )?nicht|keine ahnung|versteh\w* (die frage |das |dich )?nicht|worauf (willst )?du hinaus|was (ist|sind|hei(ß|ss)t|bedeutet|meinst)\b|kapier\w* nicht|hä\??$|\?\?+)/i;
function coachHints(th){
  const users=th.filter(x=>x.role==='user');const ais=th.filter(x=>x.role==='ai');
  let stuck=0;for(let i=users.length-1;i>=0&&STUCK.test(users[i].text.trim());i--)stuck++;
  const h=[];
  if(stuck===1)h.push('Die Person kommt gerade nicht weiter. Gib jetzt einen kleinen Wissensbaustein mit konkretem Fall und stelle danach eine leichte Auswahlfrage.');
  if(stuck>=2)h.push(`Die Person hängt zum ${stuck}. Mal hintereinander fest. Gib jetzt deutlich mehr Unterstützung: Erkläre den Zusammenhang des aktuellen Teilschritts in 2–3 einfachen Sätzen selbst und lass sie ihn nur noch an einem konkreten Beispiel anwenden oder in eigenen Worten wiederholen.`);
  const lastQs=ais.slice(-3).map(x=>(x.text.match(/[^.!?\n]*\?/g)||[]).pop()).filter(Boolean);
  if(lastQs.length)h.push('Deine letzten Fragen waren: '+lastQs.map(q=>'„'+q.trim()+'“').join(' ')+' – stelle keine davon (auch nicht umformuliert) erneut.');
  const vis=ais.slice(-8).filter(x=>x.visual).map(x=>x.visual.title);
  if(vis.length)h.push('Bereits gezeigte Schaubilder (nicht erneut senden): '+vis.join(', ')+'.');
  return h.length?'\n\n[Hinweise der App an SOKRATES – nicht erwähnen: '+h.join(' ')+']':'';
}
async function aiPath(s,m){
  const r=await ask(PLANNER+'\n\nAUFGABE: Zerlege einen Meilenstein in einen Lernpfad aus 3–5 kleinen, aufeinander aufbauenden Teilschritten für ein sokratisches Einzelgespräch. Beginne bei dem, was Schüler:innen ohne Vorwissen verstehen können (Begriffe klären, konkreter Fall), und ende beim Ziel des Meilensteins.',
    `${planContext(s,6000)}\n\nMeilenstein: ${m.title}\nZiel: ${m.goal}\nErwartungshorizont: ${m.sample}\n\nFormat: {"steps":[{"title":"kurzer Titel","kern":"was die Person am Ende dieses Schritts verstanden haben soll (1–2 Sätze)","beispiel":"konkreter Fall oder Beispiel zum Anknüpfen (aus dem Kanon)","fehl":"typische Fehlvorstellung oder Stolperstelle"}]}`,
    {json:true,tier:'complex',fallback:()=>({steps:[]})});
  return (Array.isArray(r.steps)?r.steps:[]).slice(0,6).map(x=>({title:str(x.title),kern:str(x.kern),beispiel:str(x.beispiel),fehl:str(x.fehl)})).filter(x=>x.title&&x.kern);
}

  sending=false;
  {const th2=thread(),p2=pr();if(th2!==th&&!th2.some(x=>x.t&&x.role==='user'&&x.text===text))th2.push({role:'user',who:me.name,text,t:now()});th=th2;p=p2}

  if(m.id!=='side'){

    if(r.flag){p.flags.push({t:now(),reason:String(r.flag),text:text.slice(0,200)})}

    const mp=liveMs(ser(),m).path||[];

  else txt=`<b>Gruppenarbeit</b> an Tisch ${g?.table} mit <b>${esc(others)}</b>. ${esc(ph.task||'')} <span class="spacer"></span> noch <span data-t>${mmss(r.ms)}</span>`;

let CV=null;
function setupCanvas(){
  const cv=$('#cv'),ctx=cv.getContext('2d');
  const st={c:'#1d2433',w:2.4,mode:'pen'};const undo=[];let down=false,last=null;
  const colors=['#1d2433','#b4532a','#3557c4','#2f9e6e','#d98a1c'];
  $('#tools').innerHTML=colors.map((c,i)=>`<button class="dot ${i===0?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')+
   `<span style="width:1px;height:22px;background:var(--line);margin:0 .3em"></span><button class="bs bg on" data-w="2.4">fein</button><button class="bs bg" data-w="6">dick</button><button class="bs bg" data-w="18" data-hl>Marker</button><button class="bs bg" data-er>Radierer</button><span class="spacer"></span><button class="bs bg" data-undo>↶</button><button class="bs bg" data-clear>Leeren</button>`;
  const setOn=(sel,el)=>{$$(sel,$('#tools')).forEach(x=>x.classList.remove('on'));el.classList.add('on')};
  $$('[data-c]').forEach(b=>b.onclick=()=>{st.c=b.dataset.c;if(st.mode==='eraser')st.mode='pen';setOn('[data-c]',b)});
  $$('[data-w]').forEach(b=>b.onclick=()=>{st.w=+b.dataset.w;st.mode=b.hasAttribute('data-hl')?'hl':'pen';setOn('[data-w],[data-er]',b)});
  $('[data-er]').onclick=e=>{st.mode='eraser';setOn('[data-w],[data-er]',e.target)};
  $('[data-undo]').onclick=()=>{const d=undo.pop();if(!d)return;paint(d);save()};
  $('[data-clear]').onclick=()=>{undo.push(cv.toDataURL());fill();const p=pr();p.drawn=false;p.drawing=null;persist()};
  const dpr=()=>window.devicePixelRatio||1;
  function fill(){const r=cv.getBoundingClientRect();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.restore()}
  function paint(src){fill();if(!src)return;const img=new Image();img.onload=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(img,0,0);ctx.restore()};img.src=src}
  function fit(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;const keep=cv.width>1?cv.toDataURL():null;cv.width=Math.round(r.width*dpr());cv.height=Math.round(r.height*dpr());ctx.setTransform(dpr(),0,0,dpr(),0,0);ctx.lineCap='round';ctx.lineJoin='round';paint(keep||pr().drawing)}
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure&&e.pointerType==='pen'?e.pressure:.5}};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);down=true;undo.push(cv.toDataURL());if(undo.length>25)undo.shift();last=pt(e);stroke(last,last)};
  cv.onpointermove=e=>{if(!down)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const p=pt(ev);stroke(last,p);last=p}};
  cv.onpointerup=cv.onpointercancel=()=>{if(!down)return;down=false;save()};
  function stroke(a,b){ctx.globalAlpha=st.mode==='hl'?.28:1;ctx.strokeStyle=st.mode==='eraser'?'#fff':st.c;ctx.lineWidth=st.mode==='eraser'?24:st.w*(st.mode==='pen'?(.6+b.p*.9):1);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x+.01,b.y);ctx.stroke();ctx.globalAlpha=1}
  let sv=null;function save(){clearTimeout(sv);sv=setTimeout(()=>{const p=pr();p.drawing=cv.toDataURL('image/png');p.drawn=true;p.drawingDirty=true;persist()},250)}
  new ResizeObserver(()=>{if($('#drawwrap').style.display!=='none')fit()}).observe(cv);
  CV={fit,load:()=>{cv.width=1;fit()},data:()=>cv.toDataURL('image/png')};
}

  $('#go',md).onclick=()=>{ui.msIdx=idx;closeModal();refreshWork(true);startChallenge(c)};
}
function offerChallenge(){if(ui.inChallenge||$('#modal-root').innerHTML)return;const md=modal(`<div style="text-align:center"><div style="font-size:2em;color:var(--acc)">✦</div><h2>Kleine Herausforderung?</h2><p class="muted">SOKRATES hat eine kurze Aufgabe für dich, um zu sehen, wie weit du schon bist.</p></div><div class="actions" style="justify-content:center"><button data-x>Später</button><button class="ba" id="go">Gern</button></div>`);md.querySelector('[data-x]').onclick=closeModal;$('#go',md).onclick=()=>{closeModal();startChallenge(null)}}
async function startChallenge(c){
  const s=ser(),m=curMs();if(m.id==='side'){toast('Auf den Seitenpfaden gibt es keine Challenges.');return}
  ui.inChallenge=true;closeDrawer();
  const p=pr();const adv=s.advanced?.[ui.sid];
  const md=modal(`<div class="row"><span class="chip acc">Challenge</span><span class="spacer"></span><span class="timer" id="ct">…</span></div><h2 style="margin-top:.6em">${esc(m.title)}</h2><div id="cq" class="muted" style="margin:.6em 0 1em">SOKRATES überlegt sich eine Aufgabe …</div><textarea id="ca" rows="8" placeholder="Deine Antwort …" disabled></textarea><div class="actions"><button data-x>Abbrechen</button><button class="ba" id="sub" disabled>Abgeben</button></div>`,{wide:true,sticky:true});
  let tm=null;
  md.querySelector('[data-x]').onclick=()=>{ui.inChallenge=false;clearInterval(tm);if(c){ui.dismissed=[...(ui.dismissed||[]),c.id]}closeModal()};
  let q=c&&c.q,kind='kurz',minutes=c?c.min:(4);
  if(!q){const r=await ask(`Du erstellst eine kurze Lernstandsaufgabe (Challenge) für eine Schülerin/einen Schüler der Klasse ${s.klasse}. Die Aufgabe soll Verstehen prüfen (erklären, begründen, vergleichen, anwenden), nicht reines Abfragen. Stütze dich auf den Kanon. Schwierigkeit: ${adv?'erhöht':'Standard'}; bisheriger Fortschritt im Meilenstein: ${p.p} %.\n\nKANON:\n${canonContext(s,m.title+' '+m.goal,6000)}`,
      `Meilenstein: ${m.title}\nZiel: ${m.goal}\nErwartungshorizont: ${m.sample}\nBisherige Challenges: ${p.challenges.map(x=>x.q).join(' | ')||'keine'}\n\nFormat: {"question":"klar formulierte Aufgabe mit Operator","minutes":Zahl 2–10}`,
      {json:true,fallback:()=>({question:`Erkläre in eigenen Worten und in höchstens fünf Sätzen: ${m.goal||m.title}`,minutes:5})});
    q=r.question||`Erkläre in eigenen Worten: ${m.title}`;minutes=clamp(+r.minutes||5,2,15)}
  if(!ui.inChallenge)return;
  $('#cq',md).classList.remove('muted');$('#cq',md).innerHTML=`<b style="font-size:1.1em">${esc(q)}</b>`;
  const ta=$('#ca',md);ta.disabled=false;ta.focus();$('#sub',md).disabled=false;
  const end=now()+minutes*60e3;tm=setInterval(()=>{const el=$('#ct',md);if(!el){clearInterval(tm);return}const r=end-now();el.textContent=mmss(Math.max(0,r));el.style.color=r<30e3?'var(--bad)':'';if(r<=0){clearInterval(tm);submit(true)}},500);
  $('#sub',md).onclick=()=>submit(false);
  async function submit(auto){
    clearInterval(tm);const a=ta.value.trim();
    if(!a&&!auto){toast('Schreib zuerst eine Antwort.');return}
    ta.disabled=true;$('#sub',md).disabled=true;$('#sub',md).textContent='SOKRATES liest …';md.querySelector('[data-x]').style.display='none';
    const r=await ask(`Du bewertest eine Challenge-Antwort einer Schülerin/eines Schülers der Klasse ${s.klasse} am Erwartungshorizont. Sei fair, genau und ermutigend. Gib KEINE vollständige Musterlösung, sondern benenne konkret, was gelungen ist, und formuliere, was fehlt, als Denkanstoß oder Frage. Achte auf fachliche Richtigkeit, Fachbegriffe und Begründung.\n\nKANON (Auszug):\n${canonContext(s,m.title+' '+q,5000)}`,
      `Meilenstein: ${m.title}\nZiel: ${m.goal}\nErwartungshorizont: ${m.sample}\nAufgabe: ${q}\nAntwort: ${a||'(keine Antwort – Zeit abgelaufen)'}\n\nFormat: {"score":0–100,"feedback_student":"2–4 Sätze, direkt an die Person (du)","note_teacher":"ein Satz Diagnose für die Lehrkraft"}`,
      {json:true,fallback:()=>({score:a?clamp(30+Math.round(a.length/6),30,85):0,feedback_student:'(Offline-Demo) Danke für deine Antwort! Mit verbundener KI bekommst du hier ein genaues Feedback.',note_teacher:'(Offline-Demo) Challenge abgegeben.'})});
    const score=clamp(Math.round(+r.score||0),0,100);
    const pc=P(ui.sid,ser().id,m.id),sc=ser();
    pc.challenges.push({cid:c?.id||null,t:now(),q,a,score,fb:r.feedback_student||''});
    if(r.note_teacher)pc.notes.push({t:now(),text:'Challenge: '+r.note_teacher});
    pc.p=Math.round((pc.p+score)/2);pc.last=now();
    if(sc.timeline==='lose'&&sc.mode==='school'&&pc.p>=70&&typeof ui.msIdx==='number'&&(sc.reach?.[ui.sid]||0)<=ui.msIdx&&ui.msIdx<sc.milestones.length-1){sc.reach??={};sc.reach[ui.sid]=ui.msIdx+1}
    thread().push({role:'sys',t:now(),text:`Challenge abgeschlossen · ${score} %`});
    persist();ui.inChallenge=false;
    const box=$('.modal');if(!box)return;
    box.innerHTML=`<div style="text-align:center" class="fade"><div style="display:inline-block">${ringSVG(score,90)}</div><h2 style="margin:.4em 0">${score} %</h2></div><div class="card fade2" style="background:var(--soft2)"><div class="small muted">Aufgabe</div><div>${esc(q)}</div><div class="small muted" style="margin-top:.8em">Feedback</div><div class="ai-out">${esc(r.feedback_student||'')}</div></div><div class="actions"><button class="bp" id="done">Weiter</button></div>`;
    $('#done').onclick=()=>{closeModal();refreshWork()};
  }
}

/* ---------- Start ---------- */
loadState().then(renderStart);
</script>
